name: Socrates Engine Automated Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js Runtime environment
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Pure JS Production Dependencies
      run: npm ci

    - name: Verify Application Logic via Automation Test Suite
      run: npm test

    - name: Setup Java JDK Environment for Android Compiling
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK Platform Components
      uses: android-actions/setup-android@v3

    - name: Inject Mobile Capacitor Android Assets
      run: |
        npx cap sync android

    - name: Compile Production Debug APK File
      run: |
        cd android && ./gradlew assembleDebug

    - name: Upload Universal Binary APK Artifact to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: socrates-engine-universal-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
