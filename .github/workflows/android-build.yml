name: Socrates Engine Automated Production Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js Runtime Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Pure JS Production Dependencies
      run: npm ci

    - name: Verify Application Logic via Automation Test Suite
      run: npm test

    - name: Build Web Application Assets
      run: |
        echo "Mengompilasi aset antarmuka kognitif untuk deployment desentralisasi..."
        mkdir -p dist
        cp -r public/* dist/
